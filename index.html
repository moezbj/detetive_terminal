<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Detective Terminal | AI Murder Mysteries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: crosshair;
    }

    .font-serif {
      font-family: 'Crimson Pro', serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* CRT Scanline Effect */
    .terminal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 9999;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      opacity: 0.15;
    }

    /* Animations */
    @keyframes flicker {
      0% {
        opacity: 0.97;
      }

      5% {
        opacity: 0.95;
      }

      10% {
        opacity: 0.9;
      }

      15% {
        opacity: 0.95;
      }

      20% {
        opacity: 0.98;
      }

      25% {
        opacity: 0.95;
      }

      30% {
        opacity: 0.9;
      }

      35% {
        opacity: 0.95;
      }

      40% {
        opacity: 0.98;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes stamp-slam {
      0% {
        transform: scale(5);
        opacity: 0;
      }

      80% {
        transform: scale(0.9);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    @keyframes terminal-shake {
      0% {
        transform: translate(1px, 1px) rotate(0deg);
      }

      10% {
        transform: translate(-1px, -2px) rotate(-1deg);
      }

      20% {
        transform: translate(-3px, 0px) rotate(1deg);
      }

      30% {
        transform: translate(3px, 2px) rotate(0deg);
      }

      40% {
        transform: translate(1px, -1px) rotate(1deg);
      }

      50% {
        transform: translate(-1px, 2px) rotate(-1deg);
      }

      60% {
        transform: translate(-3px, 1px) rotate(0deg);
      }

      70% {
        transform: translate(3px, 1px) rotate(-1deg);
      }

      80% {
        transform: translate(-1px, -1px) rotate(1deg);
      }

      90% {
        transform: translate(1px, 2px) rotate(0deg);
      }

      100% {
        transform: translate(1px, -2px) rotate(-1deg);
      }
    }

    @keyframes particle-fall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .animate-fadeIn {
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-stamp {
      animation: stamp-slam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-shake {
      animation: terminal-shake 0.5s linear;
    }

    .celebration-particle {
      position: absolute;
      top: 0;
      color: #dc2626;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      pointer-events: none;
      z-index: 50;
      animation: particle-fall linear forwards;
    }

    .case-closed-stamp {
      font-family: 'JetBrains Mono', monospace;
      border: 8px solid #dc2626;
      color: #dc2626;
      padding: 1rem 2rem;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.2em;
      transform: rotate(-15deg);
      display: inline-block;
      user-select: none;
    }

    /* Standard Utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #b91c1c;
    }
  </style>

</head>

</html>
